[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esg-catalyst"
version = "0.1.0"
description = "AI-powered ESG reporting and scoring platform"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",

    # Database
    "sqlalchemy==2.0.36",
    "asyncpg==0.29.0",
    "alembic==1.13.3",

    # Pydantic (FastAPI uses this for schemas)
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",

    # Task queue
    "celery==5.4.0",
    "redis==5.1.1",
    "flower==2.0.1",          # Celery monitoring UI

    # LLM / LangChain
    "langchain==0.3.7",
    "langchain-openai==0.2.8",
    "langchain-community==0.3.7",
    "openai==1.52.2",         # OpenRouter is OpenAI-compatible

    # Vector store
    "chromadb==0.5.18",

    # Embeddings
    "sentence-transformers==3.2.1",

    # Document parsing
    "pymupdf==1.24.11",       # PyMuPDF — digital PDFs
    "unstructured[pdf]==0.15.14",  # scanned / complex docs
    "pytesseract==0.3.13",    # OCR wrapper

    # ESG / NLP classifier
    "transformers==4.45.2",
    "torch==2.4.1",
    "accelerate==1.0.1",

    # Experiment tracking
    "mlflow==2.17.0",

    # Utilities
    "python-jose[cryptography]==3.3.0",  # JWT auth
    "passlib[bcrypt]==1.7.4",            # password hashing
    "httpx==0.27.2",                     # async HTTP client
    "tenacity==9.0.0",                   # retry logic
    "structlog==24.4.0",                 # structured logging
    "python-dotenv==1.0.1",

    # Data processing
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",          # for FastAPI TestClient async
    "factory-boy==3.3.1",
    "ruff==0.7.0",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Existing backend source pre-dates ruff formatter adoption; exclude from format enforcement.
# Run `ruff format backend/` once as a dedicated cleanup commit to bring it in.
exclude = [
    "backend/app",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line-length handled by formatter
# B008: FastAPI Depends() in function defaults is the canonical pattern
# B904: raise-without-from-inside-except — deferred to Phase 2 hardening
# B905: zip() strict= — deferred to Phase 2 hardening
ignore = ["E501", "B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
# Existing source files — incremental cleanup only; suppress style churn on legacy code
"backend/app/**" = ["I001", "F401", "UP", "SIM102", "SIM108", "B007"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Strict checks on new code; relax on existing source until type annotations are added.
warn_return_any = false
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "app.core.pipeline.ingestion",
    "app.core.pipeline.classifier",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
